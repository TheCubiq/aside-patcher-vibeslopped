name: Aside compatibility candidate
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-candidate
  cancel-in-progress: false
jobs:
  detect:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      supported: ${{ steps.release.outputs.supported }}
      package_sha256: ${{ steps.release.outputs.package_sha256 }}
      seen: ${{ steps.seen.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: release
        shell: pwsh
        run: |
          uv run python scripts/check_release.py release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release=Get-Content release.json -Raw|ConvertFrom-Json
          $builds=(Get-Content aside_patcher/builds.json -Raw|ConvertFrom-Json).builds
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "supported=$([bool]($builds|Where-Object version -eq $release.version))" >> $env:GITHUB_OUTPUT
          "package_sha256=$($release.package_sha256)" >> $env:GITHUB_OUTPUT
      - id: seen
        uses: actions/cache/restore@v4
        with:
          path: .analysis-marker
          key: aside-analyzed-${{ steps.release.outputs.package_sha256 }}-${{ github.sha }}
          lookup-only: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-descriptor
          path: release.json
  analyze:
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.seen != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run engine regression tests
        run: uv run --extra catalog python -m unittest discover -q
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aside-archive
          key: aside-originals-${{ needs.detect.outputs.version }}-${{ needs.detect.outputs.package_sha256 }}-v1
      - name: Acquire exact official browser packages without execution
        shell: pwsh
        run: |
          uv run python scripts/archive_aside.py --root "$env:RUNNER_TEMP/aside-archive" --packages 1.0.928.2 '${{ needs.detect.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/analyze_versions.py --archive "$env:RUNNER_TEMP/aside-archive" --output analysis.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render only an already reviewed build
        if: needs.detect.outputs.supported == 'True'
        shell: pwsh
        run: |
          $metadata=Get-ChildItem "$env:RUNNER_TEMP/aside-archive/browsers/${{ needs.detect.outputs.version }}" -Filter browser.json -Recurse
          if (@($metadata).Count -ne 1) { throw 'Ambiguous original archive' }
          $record=Get-Content $metadata.FullName -Raw|ConvertFrom-Json
          if ($record.package_sha256 -ne '${{ needs.detect.outputs.package_sha256 }}') { throw 'Package changed after release detection' }
          $dll=Join-Path $metadata.DirectoryName $record.dll
          uv run --extra catalog python scripts/compatibility_release.py build --version '${{ needs.detect.outputs.version }}' --dll $dll --output candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explain unsupported release
        if: needs.detect.outputs.supported != 'True'
        shell: pwsh
        run: "'New release needs adapter validation. Candidate analysis is available; no installable support was generated.' >> $env:GITHUB_STEP_SUMMARY"
      - name: Explain pending VM acceptance
        if: needs.detect.outputs.supported == 'True' && vars.ASIDE_UI_TESTS_ENABLED != 'true'
        shell: pwsh
        run: "'Static candidate prepared. Interactive VM validation is pending setup; this candidate cannot be published.' >> $env:GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: |
            analysis.json
            candidate/
          retention-days: 30
      - name: Record analyzed artifact identity
        shell: pwsh
        run: "'${{ needs.detect.outputs.package_sha256 }}' | Set-Content .analysis-marker"
      - uses: actions/cache/save@v4
        with:
          path: .analysis-marker
          key: aside-analyzed-${{ needs.detect.outputs.package_sha256 }}-${{ github.sha }}
  runtime:
    if: needs.detect.outputs.supported == 'True' && vars.ASIDE_UI_TESTS_ENABLED == 'true'
    needs: [detect, analyze]
    runs-on: [self-hosted, Windows, X64, aside-ui-test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: tested-candidate
      - name: Require isolated interactive VM and reviewed native UI harness
        shell: pwsh
        run: |
          if ($env:ASIDE_DISPOSABLE_VM -ne '1' -or -not [Environment]::UserInteractive) { throw 'An isolated interactive desktop VM is required' }
          if (-not $env:ASIDE_UI_TEST_SCRIPT -or -not (Test-Path -LiteralPath $env:ASIDE_UI_TEST_SCRIPT)) { throw 'Configure the reviewed native UI harness; runtime checks cannot be inferred from hashes' }
          & $env:ASIDE_UI_TEST_SCRIPT -CandidateDirectory (Resolve-Path tested-candidate/candidate) -ReportPath "$PWD/runtime.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path runtime.json)) { throw 'UI harness produced no evidence report' }
      - uses: actions/upload-artifact@v4
        with:
          name: tested-${{ github.run_id }}
          path: |
            tested-candidate/candidate/
            runtime.json
            screenshots/
          retention-days: 30
      - name: VM lifecycle
        if: always()
        shell: pwsh
        run: "'Reset this disposable runner snapshot before accepting another job.' >> $env:GITHUB_STEP_SUMMARY"
